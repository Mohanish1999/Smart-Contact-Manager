<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{normal/base :: Layout(~{::section})}">
<head><title>Contact</title></head>
<body>
<section>
    <div class="page-header">
        <div><h1>Contact details</h1></div>
        <a class="btn btn-outline-secondary" th:href="@{/user/show-contacts}"><svg th:replace="~{fragments :: icon('arrow-left')}"></svg>Back to contacts</a>
    </div>

    <div class="card-lite form-card">
        <div class="pad text-center" style="border-bottom: 1px solid var(--line);">
            <img th:replace="~{fragments :: avatar(${contact.image}, 'avatar avatar-lg', ${contact.name})}">
            <h2 class="mt-3 mb-1" th:text="${contact.name}">Name</h2>
            <div class="text-muted" th:if="${contact.secondname}" th:text="${contact.secondname}">Nickname</div>
            <div class="mt-2" th:if="${contact.work}"><span class="badge-role" th:text="${contact.work}">Work</span></div>
        </div>
        <div class="card-body-pad">
            <div class="detail-row" th:if="${contact.email}">
                <svg th:replace="~{fragments :: icon('mail')}"></svg>
                <div><div class="k">Email</div><div class="v"><a th:href="'mailto:' + ${contact.email}" th:text="${contact.email}">email</a></div></div>
            </div>
            <div class="detail-row">
                <svg th:replace="~{fragments :: icon('phone')}"></svg>
                <div><div class="k">Phone</div><div class="v"><a th:href="'tel:' + ${contact.phone}" th:text="${contact.phone}">phone</a></div></div>
            </div>
            <div class="detail-row" th:if="${contact.description}">
                <svg th:replace="~{fragments :: icon('info')}"></svg>
                <div><div class="k">Description</div><div class="v" th:text="${contact.description}">Description</div></div>
            </div>
            <div class="form-actions">
                <a class="btn btn-primary" th:href="@{/user/update-contact/{id}(id=${contact.cid})}"><svg th:replace="~{fragments :: icon('edit-2')}"></svg>Edit</a>
                <form th:action="@{/user/delete/{id}(id=${contact.cid})}" method="post" class="m-0"
                      data-confirm data-confirm-title="Delete this contact?"
                      th:attr="data-confirm-text='This will permanently delete ' + ${contact.name} + '. This cannot be undone.'">
                    <button type="submit" class="btn btn-outline-danger"><svg th:replace="~{fragments :: icon('trash-2')}"></svg>Delete</button>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
