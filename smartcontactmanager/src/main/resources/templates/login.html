<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: Layout(~{::section})}">
<head><title>Login</title></head>
<body>
<section class="auth-split">
    <div class="container">
        <div class="row no-gutters" style="max-width: 980px; margin: 0 auto; box-shadow: var(--shadow-md); border-radius: var(--radius);">
            <div class="col-lg-5">
                <div class="auth-panel">
                    <img th:src="@{/img/illustration-contacts.svg}" alt="">
                    <h2>Welcome back</h2>
                    <p class="mb-0">Your contacts are right where you left them.</p>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="auth-card card-lite">
                    <h1 class="title">Log in</h1>
                    <p class="sub">Enter your email and password to continue.</p>

                    <div th:replace="~{fragments :: flash(${message})}"></div>
                    <div th:if="${param.error}" class="flash alert alert-danger" role="alert">Invalid email or password.</div>
                    <div th:if="${param.logout}" class="flash alert alert-success" role="alert">You have been logged out.</div>
                    <div th:if="${param.deleted}" class="flash alert alert-info" role="alert">Your account has been deleted.</div>

                    <form th:action="@{/dologin}" method="post">
                        <div class="form-group">
                            <label for="username">Email</label>
                            <input type="email" id="username" name="username" class="form-control" autocomplete="username"
                                   placeholder="you@example.com" required autofocus>
                        </div>
                        <div th:replace="~{fragments :: password('password', 'password', 'Password', 'current-password')}"></div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="custom-control custom-checkbox">
                                <input type="checkbox" class="custom-control-input" id="rememberMe" name="remember-me">
                                <label class="custom-control-label" for="rememberMe">Remember me</label>
                            </div>
                            <a th:href="@{/forgot}">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Log in</button>
                    </form>
                    <hr>
                    <p class="auth-links">New here? <a th:href="@{/signup}">Create an account</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
