<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: Layout(~{::section})}">
<head><title>Reset password</title></head>
<body>
<section class="auth-split">
    <div class="container">
        <div class="auth-card card-lite solo">
            <h1 class="title">Choose a new password</h1>
            <p class="sub" th:text="${passwordHint} ?: 'Use at least 8 characters, including a letter and a number.'"></p>

            <div th:replace="~{fragments :: flash(${message})}"></div>

            <form th:action="@{/change-password}" method="post">
                <div th:replace="~{fragments :: password('newPassword', 'newPassword', 'New password', 'new-password')}"></div>
                <div th:replace="~{fragments :: password('confirmPassword', 'confirmPassword', 'Confirm new password', 'new-password')}"></div>
                <button type="submit" class="btn btn-primary btn-block">Update password</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
