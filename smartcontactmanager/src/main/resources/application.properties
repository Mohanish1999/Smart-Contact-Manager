spring.application.name=smartcontactmanager-1

server.port=9090

# ---- Database (override with environment variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartcontact?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# ---- Mail (credentials come from environment variables, never from source control) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:kothawademohanish@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ruinnzaqewgxbeot}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Razorpay (see RAZORPAY_SETUP.md) ----
# Test keys start with rzp_test_, live keys with rzp_live_. Never commit them.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_To5ZUI1MqTTDQ2}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:3H2lthsHSmCpsbOx8BQEW5mm}
# Secret you set when creating the webhook in the Razorpay Dashboard (optional but recommended)
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=INR
razorpay.min-amount=1
razorpay.max-amount=100000
razorpay.merchant-name=Smart Contact Manager

# ---- Uploads (profile and contact photos) ----
app.upload-dir=${UPLOAD_DIR:user-photos}
app.upload-max-bytes=2097152
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---- Security ----
app.password.min-length=8
# Optional: a long random string so "remember me" logins survive restarts
app.remember-me-key=${REMEMBER_ME_KEY:}
