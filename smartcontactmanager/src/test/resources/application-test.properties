# Isolated test configuration: in-memory H2, never touches the production MySQL database.
spring.datasource.url=jdbc:h2:mem:scmtest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# "USER" is a reserved word in H2; quoting every identifier avoids touching the production table name.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.mail.host=localhost
spring.mail.username=
spring.mail.password=

# Dummy Razorpay values: tests never contact Razorpay
razorpay.key-id=rzp_test_dummykey
razorpay.key-secret=test_secret_not_real
razorpay.webhook-secret=whsec_test_not_real

app.upload-dir=target/test-photos
app.remember-me-key=test-remember-me-key
